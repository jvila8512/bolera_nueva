<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Reporte Diario</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        text-align: center;
      }
      .fecha-container {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      table {
        margin: 0 auto;
        border-collapse: collapse;
        width: 50%;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h1>Reporte Diario</h1>

    <div class="fecha-container">
      <div><strong>Fecha de emitido:</strong> {{ fecha_emitido }}</div>
      <div><strong>Fecha:</strong> {{ fecha }}</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Juegos</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{{ juegos }}</td>
          <td>{{ total }}</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
